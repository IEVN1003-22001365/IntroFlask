{% extends "layout.html" %}

{% block container %}
<h2>Calcular Distancia entre dos puntos</h2>
<hr />

<form action="/distancia" method="post">
    <div class="row">
        <div class="col-6">
            <h4>Punto 1</h4>
            <div class="mb-2">
                <label>X1:</label>
                <input type="number" step="any" name="x1" class="form-control" placeholder="0" value="{{ x1 }}" required>
            </div>
            <div class="mb-2">
                <label>Y1:</label>
                <input type="number" step="any" name="y1" class="form-control" placeholder="0" value="{{ y1 }}" required>
            </div>
        </div>
        <div class="col-6">
            <h4>Punto 2</h4>
            <div class="mb-2">
                <label>X2:</label>
                <input type="number" step="any" name="x2" class="form-control" placeholder="0" value="{{ x2 }}" required>
            </div>
            <div class="mb-2">
                <label>Y2:</label>
                <input type="number" step="any" name="y2" class="form-control" placeholder="0" value="{{ y2 }}" required>
            </div>
        </div>
    </div>
    <br />
    <button type="submit" class="btn btn-primary">
        Calcular Distancia
    </button>
</form>

<br />

{% if resultado is not none %}
<div class="col-6">
    <h3>La distancia es: {{ "%.2f"|format(resultado) }}</h3>
</div>
{% endif %}

{% endblock %}
